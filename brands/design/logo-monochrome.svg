<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="rcrm monochrome mark">
  <title>rcrm — monochrome mark</title>
  <!-- The Android 13 themed icon: the shield with the R knocked out, so the
       launcher's own tint shows through the letter. Derived from logo.svg by
       turning the white R paths into a mask; the keyhole is deliberately left
       out because it is invisible in the colour mark too (red on red) and only
       adds noise at themed-icon sizes. -->
  <defs>
    <mask id="rcrm-cut">
      <rect width="512" height="512" fill="#FFFFFF"/>
      <g fill="#000000">
        <rect x="152" y="84" width="48" height="316"/>
        <path d="M200 84 A112 112 0 0 1 200 308 L200 260 A64 64 0 0 0 200 132 Z"/>
        <path d="M200 296 L240 296 L320 400 L280 400 Z"/>
      </g>
    </mask>
  </defs>
  <path fill="#FFFFFF" mask="url(#rcrm-cut)" d="M256 48 L360 48 L424 88 V264 C424 356 352 424 256 464 C160 424 88 356 88 264 V88 Z"/>
</svg>
