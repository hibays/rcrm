[workspace]
members = [
	"crates/rcrm-core",
	"crates/rcrm-server",
	"crates/rcrm-flutter-bridge",
]
resolver = "3"

[package]
name = "rcrm"
version = "0.1.0"
edition = "2024"

[dependencies]
rcrm-core = { path = "crates/rcrm-core" }
rcrm-server = { path = "crates/rcrm-server" }
clap = { version = "4", features = ["derive"] }
dialoguer = "0.12"
indicatif = "0.18"
mimalloc = { version = "*", features = ["v3"] }
dunce = "1.0.5"
zeroize = { version = "1.8.2", features = ["simd"] }
ctrlc = "3"

[dev-dependencies]
zip = "6"
rand = "0.10"
rustls = { version = "0.23", default-features = false, features = [
	"aws_lc_rs",
	"prefer-post-quantum",
	"std",
	"tls12",
] }
base64 = "0.23"
crc32fast = "1.5"

[profile.dev]
overflow-checks = false

[profile.release]
overflow-checks = false
lto = true
# Maximize per-function optimization (default 16 units = less optimization)
codegen-units = 1
