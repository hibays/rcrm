[package]
name = "rcrm-server"
version = "0.1.0"
edition = "2024"

[dependencies]
rcrm-core = { path = "../rcrm-core" }
rustls = { version = "0.23", default-features = false, features = [
	"aws_lc_rs",
	"std",
	"tls12",
] }
rustls-pemfile = "2"
rcgen = { version = "0.14", default-features = false, features = [
	"aws_lc_rs",
	"pem",
] }
time = "0.3"
base64 = "0.23"
blake2 = "0.10"
zeroize = "1.8"
