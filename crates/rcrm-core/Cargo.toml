[package]
name = "rcrm-core"
version = "0.1.0"
edition = "2024"

[dependencies]
blake2 = { version = "0.11", default-features = false }
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
rand = "0.10"
crc32fast = "1.5"
chacha20 = "0.10"
mime_guess = "2"
zeroize = { version = "1.8.2", features = ["simd"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
