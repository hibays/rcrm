[package]
name = "rcrm-core"
version = "0.1.0"
edition = "2024"

[dependencies]
blake2 = { version = "0.11", default-features = false }
# `parallel` computes the p=4 Argon2id lanes concurrently. The derived key
# is byte-identical to the sequential result (same RFC 9106 computation,
# only the lane scheduling differs), so existing encrypted files stay
# readable. Measured on this machine: 84 ms → ~25 ms per derivation.
# Rayon is already in Cargo.lock (via heic / jxl-threadpool), so this adds
# no new package to the dependency graph.
argon2 = { version = "0.6", default-features = false, features = [
	"alloc",
	"parallel",
] }
rand = "0.10"
chacha20 = "0.10"
mime_guess = "2"
zeroize = { version = "1.8.2", features = ["simd"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
