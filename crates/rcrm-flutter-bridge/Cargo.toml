[package]
name = "rcrm-flutter-bridge"
version = "0.1.0"
edition = "2024"
description = "C-ABI FFI bridge exposing rcrm-core + rcrm-server to Flutter via dart:ffi"

[lib]
crate-type = ["cdylib", "staticlib"]

[features]
# The Rust software-decode path: AVIF (rav1d), JXL (jxl-oxide) and HEIC/HEIF
# (heic) stills. NOT default: Android/iOS builds enable it explicitly
# (`cargo ndk ... build -p rcrm-flutter-bridge --features mobile-decode`), and
# desktop builds must omit it (AGENTS.md) — they decode with Flutter's engine.
# Host tests:   cargo test -p rcrm-flutter-bridge --features mobile-decode
mobile-decode = ["dep:rav1d", "dep:jxl-oxide", "dep:jxl-render", "dep:heic"]

[dependencies]
rcrm-core = { path = "../rcrm-core" }
rcrm-server = { path = "../rcrm-server" }
serde_json = "1"
parking_lot = "0.12"
zeroize = { version = "1.8.2", features = ["simd"] }
dunce = "1.0.5"
rand = "0.10"
zune-jpeg = "0.5"
# EXIF + video/audio track metadata (pure Rust, no ffmpeg/libexif). Parses from
# an in-memory buffer, so the viewer's decrypted bytes never touch disk.
nom-exif = { version = "3.8", default-features = false }
# Pure-Rust WebP encode for thumbnail caching (AGPL-3.0, rcrm is open-source).
zenwebp = { version = "0.4", default-features = false, features = ["std"] }
# Self-signed cert generation for the TV cast receiver (ECDSA P-256).
rcgen = { version = "0.14", default-features = false, features = [
	"aws_lc_rs",
	"pem",
] }
# Use git version to aviod asm build error (v1.1.0) on android.
# Android/iOS (ARM .S via -Bsymbolic for .so)
rav1d = { git = "https://github.com/memorysafety/rav1d", rev = "0c851fa046d6a36430570459283e5886fbdd8a66", optional = true }
jxl-oxide = { version = "0.12", optional = true }
jxl-render = { version = "0.12", optional = true }
# HEIC/HEIF stills (AGPL-3.0-only OR Imazen commercial — rcrm is open-source,
# same family as zenwebp above; HEVC/HEIF is patent-encumbered, see the crate's
# patent notice). `backend-rust` is the pure-Rust HEVC decoder — no platform
# SDK, so it cross-compiles for Android/iOS; `parallel` decodes HEIF grid tiles
# on rayon; `std` is what `parallel` needs. Pinned to a rev like rav1d: bump
# deliberately. Part of the `mobile-decode` feature.
heic = { git = "https://github.com/imazen/heic", rev = "db52055b4d5e74dff848060b6f4006b1982802ef", default-features = false, features = [
	"backend-rust",
	"std",
	"parallel",
], optional = true }
# QR encode + decode: the C++ reference ZXing via its official Rust wrapper.
# `bundled` compiles zxing-cpp (3.1.1) with CMake and statically links it; the
# wrapper's FFI cost measured in the noise against calling the C++ directly, and
# the C++ reader beats the pure-Rust rxing port on small/blurry QR codes and is
# ~2x faster (the zxing/rxing cross-benchmark on 4900 degraded images). Build
# needs a C++ toolchain + CMake; Android/iOS shims live in scripts/cmake/.
zxing-cpp = { version = "0.5.3", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
	"Win32_System_Threading",
	"Win32_Foundation",
] }

[dev-dependencies]
jpeg-encoder = "0.7.1"
qrcode = { version = "0.14.1", default-features = false }
