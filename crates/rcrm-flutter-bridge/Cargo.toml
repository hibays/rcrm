[package]
name = "rcrm-flutter-bridge"
version = "0.1.0"
edition = "2024"
description = "C-ABI FFI bridge exposing rcrm-core + rcrm-server to Flutter via dart:ffi"

[lib]
crate-type = ["cdylib", "staticlib"]

[features]
mobile-decode = ["dep:rav1d", "dep:jxl-oxide", "dep:jxl-render"]

[dependencies]
rcrm-core = { path = "../rcrm-core" }
rcrm-server = { path = "../rcrm-server" }
serde_json = "1"
parking_lot = "0.12"
zeroize = { version = "1.8.2", features = ["simd"] }
dunce = "1.0.5"
rand = "0.10"
zune-jpeg = "0.5"
# Pure-Rust WebP encode for thumbnail caching (AGPL-3.0, rcrm is open-source).
zenwebp = { version = "0.4", default-features = false, features = ["std"] }
# Self-signed cert generation for the TV cast receiver (ECDSA P-256).
rcgen = { version = "0.14", default-features = false, features = [
	"aws_lc_rs",
	"pem",
] }
# Use git version to aviod asm build error (v1.1.0) on android.
# Android/iOS (ARM .S via -Bsymbolic for .so)
rav1d = { git = "https://github.com/memorysafety/rav1d", rev = "9f00b03bc58d94f14e157b0d365a26cf8d3b1b77", optional = true }
jxl-oxide = { version = "0.12", optional = true }
jxl-render = { version = "0.12", optional = true }
rxing = { version = "0.9.2", default-features = false, features = ["decoders", "full_barcode_format_support", "multi_barcode_readers", "encoding_rs", "encoders"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
	"Win32_System_Threading",
	"Win32_Foundation",
] }

[dev-dependencies]
jpeg-encoder = "0.7.1"
qrcode = { version = "0.14.1", default-features = false }
