[package]
name = "rcrm-flutter-bridge"
version = "0.1.0"
edition = "2024"
description = "C-ABI FFI bridge exposing rcrm-core + rcrm-server to Flutter via dart:ffi"

[lib]
crate-type = ["cdylib", "staticlib"]

[features]
# The Rust software-decode path: AVIF (rav1d), JXL (jxl-rs) and HEIC/HEIF
# (heic) stills. NOT default: Android/iOS builds enable it explicitly
# (`cargo ndk ... build -p rcrm-flutter-bridge --features mobile-decode`), and
# desktop builds must omit it (AGENTS.md) — they decode with Flutter's engine.
# Host tests:   cargo test -p rcrm-flutter-bridge --features mobile-decode
mobile-decode = ["dep:rav1d", "dep:jxl", "dep:rayon", "dep:heic", "dep:yuv"]

# Direct libmpv poster path: load the process's libmpv at runtime, seek with
# `absolute+keyframes` first for large sources (falling back to `absolute+exact`
# when the keyframe lands too early), draw the frame into Rust memory with
# MPV_RENDER_API_TYPE_SW, and encode it in place. Every platform uses it,
# including iOS — media_kit ships libmpv there as an embedded, code-signed
# `Mpv.framework` (a real MH_DYLIB), which is exactly what iOS permits: the
# app's own signed code, loaded from the bundle. A build without this feature
# has no poster renderer at all, which is why every build script enables it.
libmpv-poster = ["dep:libloading"]

[dependencies]
rcrm-core = { path = "../rcrm-core" }
rcrm-server = { path = "../rcrm-server" }
serde_json = "1"
parking_lot = "0.12"
zeroize = { version = "1.8.2", features = ["simd"] }
dunce = "1.0.5"
rand = "0.10"
zune-jpeg = "0.5"
# SIMD YUV->RGBA conversion (AVX2/NEON runtime dispatch). Writes straight into
# the DecodeBuf with no intermediate copy; 3-6x faster than the scalar loop it
# replaces for full-size 8-bit frames. Used only for the no-downscale path;
# the fused scalar convert stays for target-width downscale and high bitdepth.
# yuv 0.8 is a NEW direct dependency. zenyuv's copy is only a dev-dependency
# and never reaches this crate's build graph; there is no duplicate build.
yuv = { version = "0.8", optional = true }
# EXIF + video/audio track metadata (pure Rust, no ffmpeg/libexif). Parses from
# an in-memory buffer, so the viewer's decrypted bytes never touch disk.
nom-exif = { version = "3.8", default-features = false }
# Pure-Rust WebP encode for thumbnail caching (AGPL-3.0, rcrm is open-source).
zenwebp = { version = "0.4", default-features = false, features = ["std"] }
# Self-signed cert generation for the TV cast receiver (ECDSA P-256).
rcgen = { version = "0.14", default-features = false, features = [
	"aws_lc_rs",
	"pem",
] }
# Use git version to aviod asm build error (v1.1.0) on android.
# Android/iOS (ARM .S via -Bsymbolic for .so)
rav1d = { git = "https://github.com/memorysafety/rav1d", rev = "2e7216c20ac2a75de204d6c8d7268b75a45959b4", optional = true }
# jxl-rs (crate `jxl`): pure-Rust JPEG XL decoder used by Chrome/Firefox.
# 0.8 writes directly into a caller-supplied RGBA8 buffer, so the decoded
# pixels go straight into `DecodeBuf` with no planar/interleaved intermediate.
# Its `all-simd` default (MSRV 1.89) cross-compiles to Android/iOS without C++.
jxl = { version = "0.8", optional = true }
# The bounded `JxlParallelRunner`: jxl-rs is sequential without one. Optional so
# desktop builds keep compiling without rayon; heic's `parallel` already pulls
# it in whenever `mobile-decode` is on.
rayon = { version = "1", optional = true }
# HEIC/HEIF stills (AGPL-3.0-only OR Imazen commercial — rcrm is open-source,
# same family as zenwebp above; HEVC/HEIF is patent-encumbered, see the crate's
# patent notice). `backend-rust` is the pure-Rust HEVC decoder — no platform
# SDK, so it cross-compiles for Android/iOS; `parallel` decodes HEIF grid tiles
# on rayon; `std` is what `parallel` needs. Pinned to a rev like rav1d: bump
# deliberately. Part of the `mobile-decode` feature.
heic = { git = "https://github.com/imazen/heic", rev = "db52055b4d5e74dff848060b6f4006b1982802ef", default-features = false, features = [
	"backend-rust",
	"std",
	"parallel",
], optional = true }
# QR encode + decode: the C++ reference ZXing via its official Rust wrapper.
# `bundled` compiles zxing-cpp (3.1.1) with CMake and statically links it; the
# wrapper's FFI cost measured in the noise against calling the C++ directly, and
# the C++ reader beats the pure-Rust rxing port on small/blurry QR codes and is
# ~2x faster (the zxing/rxing cross-benchmark on 4900 degraded images). Build
# needs a C++ toolchain + CMake; Android/iOS shims live in scripts/cmake/.
zxing-cpp = { version = "0.5.3", features = ["bundled"] }
# Runtime loading of the system libmpv (the `libmpv-poster` feature). The
# library is the one media_kit already loaded for playback; nothing links
# against it at build time.
libloading = { version = "0.9", optional = true }

# The bridge's private page-locked password buffer (mlock + MADV_DONTDUMP),
# local so rcrm-core's LockedKey stays private to that crate.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
jpeg-encoder = "0.7.1"
qrcode = { version = "0.14.1", default-features = false }
