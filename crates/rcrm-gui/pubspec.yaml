name: rcrm_gui
description: "RCrm — encrypted media library browser"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.3.2

  # Networking — WebDAV client
  http: ^1.2.2
  xml: ^7.0.1

  # Video playback (media_kit / libmpv — all formats, all platforms)
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7

  # FFmpeg — thumbnails + preview clip generation
  # (Desktop uses system ffmpeg CLI; mobile uses media_kit Player.screenshot)
  # Storage
  shared_preferences: ^2.3.4
  path_provider: ^2.1.4

  # File/folder picking
  file_picker: ^10.0.0

  # Desktop window (fullscreen)
  window_manager: ^0.5.2

  # UI
  shimmer: ^3.0.0

  # FFI (explicit dependency for rust_bridge)
  ffi: ^2.0.0

  flutter_staggered_grid_view: ^0.7.0
  screen_brightness: ^2.1.11
dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.25.0
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_128.png
