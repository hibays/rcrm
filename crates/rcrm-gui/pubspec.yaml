name: rcrm_gui
description: "RCrm — encrypted media library browser"
publish_to: "none"
version: 1.0.0+1

environment:
  # Flutter 3.50.0 ships Dart 3.14.0. The Material library moved to the
  # official `material_ui` package in 3.47+; `dart fix` repointed all 82
  # `package:flutter/material.dart` imports, so older SDKs cannot build this.
  sdk: ">=3.14.0 <4.0.0"
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.4.2

  # Networking — WebDAV client
  http: ^1.2.2
  xml: ^7.0.1

  # Video playback (media_kit / libmpv — all formats, all platforms)
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7

  # FFmpeg — thumbnails + preview clip generation
  # (Desktop uses system ffmpeg CLI; mobile uses media_kit Player.screenshot)
  # Storage
  shared_preferences: ^2.3.4
  path_provider: ^2.1.4

  # File/folder picking (static API; the federated 13.x split the platform impls)
  file_picker: ^13.1.0

  # Desktop window (fullscreen). Deliberately held at 0.5.x under Flutter 3.50:
  # 0.6/0.7 is a breaking rewrite whose legacy bridge is deprecated, and it
  # swaps the platform plugins for cnativeapi — a C++ core built from source
  # into the Linux app that uses try/catch in ~70 files. Flutter 3.50's Linux
  # engine exports _Unwind_* and breaks C++ exception handling in plugins.
  # See docs/BUILDING.md → "Flutter 3.50 Linux C++ exception regression".
  # The ^0.5.2 constraint already excludes 0.6+/0.7+; keep it that way until
  # that regression is fixed and a Linux build is verified on a branch.
  window_manager: ^0.5.2

  # FFI (explicit dependency for rust_bridge)
  ffi: ^2.0.0

  flutter_staggered_grid_view: ^0.7.0
  screen_brightness: ^2.1.11
  # Keep the phone awake while a fullscreen video is on screen. Already pulled in by
  # media_kit_video, but this app now calls it directly and owns the player's
  # wakelock (see services/screen_wakelock.dart), so it is declared here.
  wakelock_plus: ^1.8.2
  crypto: ^3.0.7

  # Camera — cast pairing scan (mobile; camera_windows provides the Windows impl)
  camera: ^0.12.1
  camera_windows: ^0.2.6+4
  dynamic_color: ^2.1.0
  flutter_smart_dialog: ^5.3.1
  material_ui: ^1.10.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.25.0
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_128.png
